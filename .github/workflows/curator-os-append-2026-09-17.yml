          JSON
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('daily-curator-prompts.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          new=json.loads(pathlib.Path('/tmp/curator-2026-09-17.json').read_text(encoding='utf-8'))
          ids={x.get('id') for x in data}
          incoming=[x['id'] for x in new]
          if any(i in ids for i in incoming):
              raise SystemExit('Duplicate incoming id detected; aborting')
          if any(x.get('date')=='2026-09-17' for x in data):
              raise SystemExit('2026-09-17 already exists; aborting')
          data.extend(new)
          all_ids=[x.get('id') for x in data]
          if len(all_ids)!=len(set(all_ids)):
              raise SystemExit('Global duplicate id detected')
          todays=[x for x in data if x.get('date')=='2026-09-17']
          if len(todays)!=5:
              raise SystemExit(f'Expected 5 today, got {len(todays)}')
          required={'date','category','lens','source','title','summary','questions','strategy','task','training','caseStudy','rawText'}
          for x in todays:
              missing=required-set(x)
              if missing or len(x.get('questions',[]))!=10:
                  raise SystemExit(f'Validation failed {x.get("id")}: missing={missing}, questions={len(x.get("questions",[]))}')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          json.loads(p.read_text(encoding='utf-8'))
          print('validated', len(todays), 'today; total', len(data))
