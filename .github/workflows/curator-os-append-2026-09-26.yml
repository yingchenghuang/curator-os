  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append and validate 2026-09-30
        run: |
          cat > /tmp/new_entries.json <<'JSON'
          [{"id":"daily-2026-09-30-curator","daily":true,"date":"2026-09-30","category":"專業策展人提問思考課題","lens":"材料限制、媒介倫理與低成本策展","source":"MoMA《The Material Is the Message》官方資料（查證截至2026-09-30）","title":"策展人是在展示作品，還是在展示『限制如何變成方法』？","summary":"MoMA於2026年9月30日晚間放映《The Material Is the Message》，聚焦超低預算實驗電影如何把缺乏器材、重複使用影像、直接刮畫膠片與材料損耗轉化成作品方法。今天的核心不是讚美貧乏，而是檢查：當資源受限時，策展是否能分辨真正的創造性約束與被浪漫化的匱乏。","questions":["當作品因預算不足改變形式，這是失敗還是方法？","哪些限制真正迫使創作者做出新判斷？","哪些限制只是機構沒有提供足夠資源？","策展人是否會過度浪漫化『窮也能做藝術』？","媒材本身的耗損、刮痕與錯誤能否成為內容？","重複使用既有材料時，來源與權利如何被交代？","如果增加十倍預算，作品最重要的部分會消失嗎？","低成本是否真的等於低環境負荷？","什麼時候技術限制應被保留，什麼時候應被修正？","你的競圖中哪一個高成本項目其實沒有增加核心價值？"],"strategy":"建立『限制—反應—價值』矩陣：先列出金錢、技術、材料、時間與場域限制，再逐項判斷它迫使你產生了什麼新方法，以及是否真的增加作品價值。","task":"選一個正在發展的案子，假設預算立刻減少30%。禁止縮小所有東西，必須找出3個可以透過重新設計而非單純刪除來回應的地方。","training":"60分鐘做兩版：原案與70%預算版。最後只比較哪一版的核心概念更清楚，不比較哪一版看起來更昂貴。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"The Material Is the Message","statusAsOf":"2026-09-30","latestUpdate":"MoMA於2026年9月30日19:30放映約83分鐘的《The Material Is the Message》，節目以低預算、直接處理膠片、found footage與再利用材料等方式呈現媒材限制如何成為創作方法。","references":[{"title":"The Material Is the Message","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/events/11639","accessedAt":"2026-09-30"}]},"rawText":"【事實】MoMA 9月30日放映《The Material Is the Message》，節目聚焦超低預算與直接介入膠片、found footage、重用影像等方法。\\n【推論】限制可成為方法，但不能把資源不足自動浪漫化為創造力。\\n【原創模擬】限制—反應—價值矩陣與70%預算測試為Curator OS方法。"},{"id":"daily-2026-09-30-training","daily":true,"date":"2026-09-30","category":"策展思考訓練","lens":"刪選密度、集合敘事與非單一國家想像","source":"Whitney《Untitled (America)》與9月30日展覽導覽官方資料（查證截至2026-09-30）","title":"只用21件作品談『America』：少，會不會比多更有力量？","summary":"Whitney的《Untitled (America)》以21件作品並置1900年代至1980年代的不同美國經驗，展覽持續展出；9月30日館方安排多場展覽導覽。今日訓練聚焦『有限樣本的敘事責任』：選得少可以提高關係密度，也更容易把未被選中的經驗誤當成不存在。","questions":["21件作品足以談一個國家嗎？","作品少時，每一件被賦予的代表權是否更高？","你如何讓觀眾知道這不是完整歷史？","不同年代放在一起時，哪些斷裂會被壓平？","作品之間的相似性與衝突哪個更重要？","如果必須刪掉5件，哪個敘事會最先崩解？","若加入1件新作品，你會補缺口還是製造新的矛盾？","展覽標題中的America是地理、政治、文化還是想像？","集合展如何避免每件作品只剩下『代表某議題』？","你的策展中，哪些內容其實因為怕遺漏而被塞進來？"],"strategy":"做『刪五加一』測試：先從既有作品清單中刪5件，再只允許加回1件；觀察哪些敘事關係是真正必要的，哪些只是因為怕不完整而存在。","task":"拿你目前一個10件以上的作品清單，刪掉30%，再重新寫100字策展摘要。比較刪減前後哪一版主張更清楚。","training":"最後建立『缺席聲明』：用3句話明確指出這個策展沒有處理什麼，避免把有限選擇假裝成完整世界。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／Whitney Museum of American Art","title":"Untitled (America)","statusAsOf":"2026-09-30","latestUpdate":"《Untitled (America)》目前在Whitney 7樓持續展出，館方列出21件核心作品；2026年9月30日安排12:00與15:00展覽導覽。展覽以不同藝術家對地方、記憶、大眾文化、媒體與美國想像的回應形成並置。","references":[{"title":"Untitled (America)","publisher":"Whitney Museum of American Art","url":"https://whitney.org/exhibitions/untitled-america","accessedAt":"2026-09-30"},{"title":"Events Calendar","publisher":"Whitney Museum of American Art","url":"https://whitney.org/events","accessedAt":"2026-09-30"}]},"rawText":"【事實】Whitney《Untitled (America)》目前持續展出，官方列出21件作品，9月30日有多場展覽導覽。\\n【推論】作品數量越少，每件作品承擔的代表壓力越高。\\n【原創模擬】刪五加一與缺席聲明為Curator OS策展訓練。"},{"id":"daily-2026-09-30-participatory","daily":true,"date":"2026-09-30","category":"國際民眾參與策展實作","lens":"公共詩意、共同聆聽與低壓參與","source":"Guggenheim Café Rebay x Patrick Rosal與2026 Poet-in-Residence官方資料（查證截至2026-09-30）","title":"參與式藝術一定要『做很多事』嗎？能不能只從一起聽開始？","summary":"Guggenheim於9月30日10:30進行Café Rebay x Patrick Rosal，邀請各年齡觀眾參與由2026 Poet-in-Residence設計的持續性公共計畫。Rosal年度計畫《The Water Listeners》把水視為生活存在、感官元素與聚集／反思／交換的媒介。今天練習低壓參與：不一定要求產出作品，而是先共同注意、聆聽與留下痕跡。","questions":["參與一定需要完成一個物件嗎？","共同聆聽是否能被視為有效行動？","不想說話的人能否完整參與？","如何避免詩意語言只讓熟悉藝術的人感到自在？","不同年齡的人可以用同一種方式留下回應嗎？","公共計畫是否需要一個明確結束成果？","一次短暫的共享注意力能留下什麼？","誰負責把零散回應整理成後續知識？","如果參與者只停留30秒，這算不算參與？","你的公共藝術活動是否因為要求太多而把人擋在外面？"],"strategy":"建立『低壓參與三層』：看／聽即可、留下小痕跡、主動共同創作。允許觀眾停在任何一層，不把最高投入視為唯一成功。","task":"設計一個15分鐘公共藝術活動，必須讓路人即使只投入30秒也能完成第一層參與；不得要求下載App、註冊或填長表。","training":"找3種角色模擬：只經過的人、願意停3分鐘的人、願意投入15分鐘的人。分別寫出他們可以獲得與留下什麼。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／Guggenheim Museum","title":"Café Rebay x Patrick Rosal / The Water Listeners","statusAsOf":"2026-09-30","latestUpdate":"Guggenheim官方日曆列Café Rebay x Patrick Rosal於9月30日10:30進行，為Poet-in-Residence Patrick Rosal設計的持續性公共計畫，面向所有年齡；2026駐館計畫《The Water Listeners》聚焦水作為感知、聚集、反思與交換的媒介。","references":[{"title":"Guggenheim Calendar","publisher":"Solomon R. Guggenheim Museum","url":"https://www.guggenheim.org/calendar","accessedAt":"2026-09-30"},{"title":"Patrick Rosal Named 2026 Poet-in-Residence","publisher":"Solomon R. Guggenheim Museum","url":"https://www.guggenheim.org/wp-content/uploads/2026/04/press-release-srgm-2026-poet-in-residence-04072026.pdf","accessedAt":"2026-09-30"}]},"rawText":"【事實】Guggenheim 9月30日舉辦Café Rebay x Patrick Rosal；Rosal為2026 Poet-in-Residence，其年度計畫《The Water Listeners》討論水、聆聽與共享經驗。\\n【推論】參與式策展不必總以高投入創作為目標，也可從共同注意開始。\\n【原創模擬】低壓參與三層與30秒／3分鐘／15分鐘測試為Curator OS方法。"},{"id":"daily-2026-09-30-family","daily":true,"date":"2026-09-30","category":"親子觀展教育訓練","lens":"故事轉場、空間想像與親子共構","source":"MoMA Family Story Time官方資料（2026-09-30）","title":"讀完故事不要立刻找『正確作品』：讓孩子先決定故事應該住在哪一個空間。","summary":"MoMA於9月30日10:30舉行Family Story Time，本月主題為Spaces and Places。活動先以故事促進思考、對話、動作與創作，再透過活動單把概念帶回展廳作品。今日親子訓練把重點放在『故事如何轉場成空間』。","questions":["故事裡最重要的空間是房間、街道、自然還是想像？","孩子會把故事放在哪一個現實空間？","成人是否太快幫他對應到某件作品？","同一個故事可以住在三種不同空間嗎？","孩子選空間時在意尺寸、光、聲音還是安全感？","如果故事角色換一個地方，情節會怎麼改變？","孩子能否用身體走出故事的空間尺度？","活動單會幫助連結，還是變成尋寶式答案？","展場裡哪一個角落最像孩子自己想像的地方？","回家後能否用家中一個空間重新演一次故事？"],"strategy":"採『故事—選址—走路—重寫』四步法：先讀故事，再讓孩子自己挑一個展場位置，走過去後才問『如果故事發生在這裡，會改變什麼？』","task":"挑一本短繪本，讀完後不要討論寓意。讓孩子在一個公共空間找3個可能的故事地點，並選1個說明原因。","training":"30至45分鐘完成，最後只記錄孩子對空間條件的選擇，不評價故事理解是否正確。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"Family Story Time: Spaces and Places","statusAsOf":"2026-09-30","latestUpdate":"MoMA於2026年9月30日10:30–11:00舉行Family Story Time，9月主題為Spaces and Places；活動結合故事、材料／動作／色彩／形狀活動，並提供活動單讓家庭自行連結館內作品。","references":[{"title":"Family Story Time","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/events/11674","accessedAt":"2026-09-30"}]},"rawText":"【事實】MoMA Family Story Time於9月30日舉行，本月主題為Spaces and Places，並把故事活動延伸至館內作品。\\n【推論】故事可以成為空間閱讀入口，但不需要由成人預先指定唯一對應作品。\\n【原創模擬】故事—選址—走路—重寫為Curator OS親子訓練。"},{"id":"daily-2026-09-30-life","daily":true,"date":"2026-09-30","category":"人生策展課題","lens":"結束、撤場與不延長的能力","source":"MoMA《The Modern Window: Julien Ceccaldi》最後展期資料（查證截至2026-09-30）","title":"不是每個值得的計畫都要延長：你怎麼知道一個階段真的可以結束了？","summary":"MoMA《The Modern Window: Julien Ceccaldi》今天9月30日進入最後展日。展覽從2025年11月持續近一年，以透明壓克力、城市場景與現代主義視窗構成一個觀看都市社會生活的窗口。人生策展借用『撤場』概念：結束不一定表示失敗，有時結束是讓下一個階段獲得位置。","questions":["你目前有哪些計畫其實已完成目的，只因捨不得而繼續？","延長一個計畫的真正理由是價值還是慣性？","什麼證據可以證明它已經完成？","你是否把『還可以更好』誤當成『還不能結束』？","哪一個工作如果今天停止，不會真正造成損失？","結束前最值得保存的是成果、方法還是關係？","哪些材料應封存，哪些應直接丟掉？","你需要一個儀式來承認階段結束嗎？","撤掉舊計畫後空出的時間要保留多久，不立刻填滿？","如果不延長，你最想讓下一個階段出現什麼？"],"strategy":"建立『Close / Continue / Archive / Reopen Later』四欄。今天只決定狀態，不新增任務；任何Continue都必須寫明下一個可驗證目標，否則轉Archive。","task":"列出目前5個仍掛在心裡的計畫，各用一句話寫『它原本要完成什麼』，再決定四種狀態。","training":"完成後選一件Close或Archive的事，做15分鐘收尾：整理檔案、寫結束日期、留下三句學到的方法，然後停止。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"The Modern Window: Julien Ceccaldi","statusAsOf":"2026-09-30","latestUpdate":"MoMA官方標示Julien Ceccaldi的The Modern Window裝置於2026年9月30日最後一天展出；作品自2025年11月14日展開，以透明面板、城市場景與現代主義視覺語彙構成街窗式委託。","references":[{"title":"The Modern Window: Julien Ceccaldi","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/exhibitions/5861","accessedAt":"2026-09-30"}]},"rawText":"【事實】MoMA《The Modern Window: Julien Ceccaldi》官方標示展至2026年9月30日，今天為最後展日。\\n【推論】策展中的撤場可以轉化成人生策展的『有意識結束』能力。\\n【原創模擬】Close／Continue／Archive／Reopen Later四欄法為Curator OS人生策展工具。"}]
          JSON
          python - <<'PY'
          import json, subprocess
          path='daily-curator-prompts.json'
          with open(path,encoding='utf-8') as f: data=json.load(f)
          with open('/tmp/new_entries.json',encoding='utf-8') as f: new=json.load(f)
          ids={x.get('id') for x in data}
          day='2026-09-30'
          batch=[x for x in new if x['date']==day]
          assert len(batch)==5
          add=[x for x in batch if x['id'] not in ids]
          if add:
              data.extend(add)
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          chk=json.load(open(path,encoding='utf-8'))
          assert sum(1 for x in chk if x.get('date')==day)==5, 'today count != 5'
          allids=[x.get('id') for x in chk]
          assert len(allids)==len(set(allids)), 'duplicate ids'
          if add:
              subprocess.run(['git','config','user.name','Curator OS'],check=True)
              subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',path],check=True)
              subprocess.run(['git','commit','-m','Add five curator tasks for 2026-09-30'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
