[{"id":"daily-2026-09-25-curator","daily":true,"date":"2026-09-25","category":"專業策展人提問思考課題","lens":"聲音權利、策展邊界與不可見衝突","source":"Barbican官方資料（查證截至2026-09-26）","title":"當聲音看不見，策展人要如何證明它仍在分配權力？","summary":"Barbican於2026年9月23至26日推出Lawrence Abu Hamdan與Earshot主導的《Repercussions》，以裝置、表演、放映、音樂與參與活動討論sonic rights。今日從「不可見的聲音」切入：策展不只安排物件，也安排誰能發聲、誰必須忍受、誰有權保持沉默。","questions":["哪些聲音在場域裡被當成背景，因此從未被視為策展材料？","誰有權製造聲音，誰只能承受聲音？","安靜是否同樣是一種權利，而不只是展場禮儀？","你如何區分聲音的藝術性與它造成的實際干擾？","當觀眾無法離開聲場時，參與是否仍然成立？","哪些群體對頻率、音量或持續時間承受不同負擔？","策展文字能否說明聲音的政治性，而不替作品過度下結論？","作品若移到戶外，聲音權利的責任由誰承擔？","場館應該公開哪些聲音限制、投訴與修正機制？","若策展必須同時保護表達與拒絕聆聽的權利，你會如何設計？"],"strategy":"建立「聲音權利四層圖」：來源、承受者、退出權、回應機制。每件聲音作品都先回答四層，再談形式與美學；若任一層沒有答案，就把它列為需測試的風險。","task":"選一個你熟悉的公共空間，連續20分鐘記錄所有可辨識聲音。標示誰製造、誰承受、是否可退出，最後找出一個你原本忽略的聲音權力關係。","training":"60分鐘內用手機錄音、手繪平面圖與三段文字做一張「聲音權利地圖」。不追求聲音漂亮，只檢查聲場如何改變人的行動。","caseStudy":{"realWorld":true,"country":"英國","location":"倫敦／Barbican Centre","title":"Repercussions: A takeover by Lawrence Abu Hamdan and Earshot","statusAsOf":"2026-09-26","latestUpdate":"Barbican官方資料列活動於2026年9月23至26日進行，為該中心首個由藝術家主導的跨藝術大型takeover，聚焦sonic rights、噪音污染、沉默與聲音自決。","references":[{"title":"Barbican announces Repercussions","publisher":"Barbican Centre","url":"https://www.barbican.org.uk/our-story/press-room/barbican-announces-repercussions-a-landmark-cross-arts-takeover-led-by-turner","accessedAt":"2026-09-26"}]},"rawText":"【事實】Barbican將《Repercussions》定義為9月23至26日的跨藝術takeover，議題包括sonic rights、noise pollution與silence。\n【推論】聲音策展可被視為空間權利的分配，而非單純媒材選擇。\n【原創模擬】聲音權利四層圖與60分鐘聲場任務為Curator OS設計。"},{"id":"daily-2026-09-25-training","daily":true,"date":"2026-09-25","category":"策展思考訓練","lens":"慢看、手眼協調與觀察精度","source":"MoMA官方活動資料（查證截至2026-09-26）","title":"畫下來再說：當觀眾被迫慢看，策展判斷會變得更精準嗎？","summary":"MoMA在9月25日安排Drop-in Drawing，將繪畫作為展場內的觀看活動。今日不把畫畫視為美術技巧，而把它當成策展研究工具：當你必須用線條重建比例、距離與關係，很多原本快速略過的判斷會被迫變慢。","questions":["你第一眼看見的重點，畫五分鐘後還是同一個嗎？","哪些比例在口頭描述時被你誇大或忽略？","你最難畫出的部分是否也是最難理解的部分？","作品與牆面、地面、鄰作之間的距離如何影響判斷？","你是否用熟悉的符號替代真正看到的形狀？","畫圖時哪些細節讓你修改原先的策展敘述？","不擅長繪畫的人是否反而更能保留觀察的不確定？","如果只允許使用五條線，你會保留什麼？","同一作品畫三次，哪些關係會穩定出現？","你的文字是否能回到圖面中被驗證？"],"strategy":"將「描述」與「描繪」交叉驗證：先寫80字，再畫5分鐘，最後重寫80字。只比較兩版文字中新增、刪除與修正的判斷。","task":"選一件作品完成三張5分鐘速寫：正面、側面、距離五公尺。每張旁邊只寫三個可觀察事實，不寫感受。","training":"用45至60分鐘完成文字—速寫—重寫循環，再圈出一個因慢看而被推翻的原判斷，作為下一版策展說明的修正點。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"Drop-in Drawing","statusAsOf":"2026-09-26","latestUpdate":"MoMA 2026年9月25日行事曆列有Drop-in Drawing，時間為17:30至19:30，屬gallery experience。","references":[{"title":"MoMA Events — Sep 25, 2026","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/?date=2026-09-25&happening_filter=All+events","accessedAt":"2026-09-26"}]},"rawText":"【事實】MoMA 9月25日行事曆列出Drop-in Drawing。\n【推論】繪畫可被當成放慢觀看、檢查空間比例的研究方法。\n【原創模擬】80字—速寫—重寫流程為Curator OS訓練。"},{"id":"daily-2026-09-25-participatory","daily":true,"date":"2026-09-25","category":"國際民眾參與策展實作","lens":"低門檻創作、重複參與與非專業者","source":"Walker Art Center官方資料（2026-09-23發布，查證截至2026-09-26）","title":"參與不是一次做完：一個每週回來的Art Club如何累積公共性？","summary":"Walker Art Center於9月23日公布秋季Art Club系列：每週四免費、面向不同經驗程度，從繪畫、陶藝、zine到攝影與聲音等媒材，強調experiment、connect與create。今天的重點不是單次工作坊，而是「重複回來」如何形成一個可持續的公共學習場。","questions":["免費是否真的降低門檻，還有哪些時間與文化門檻仍存在？","第一次來的人如何在五分鐘內知道自己可以開始？","熟客與新手如何共享空間而不形成新的內圈？","活動是否要求完成作品，還是允許純粹試驗？","工作人員何時應該提供指導，何時應該退後？","每週更換媒材會增加好奇，還是讓學習無法累積？","參與者是否能影響下一期主題與材料？","什麼紀錄可以顯示一個人從觀眾逐步變成共同創作者？","如何衡量重複參與，而不把社群關係簡化成出席數？","如果活動取消一個月，公共性會留下什麼？"],"strategy":"把參與設計成三層：第一次能進入、第二次能熟悉、第三次能貢獻。每層都指定一個行動權，而不是只增加內容。","task":"設計一個連續三週的公共藝術小型Art Club，每週90分鐘。第一週觀察與試材、第二週共同修改、第三週由參與者決定展示方式。","training":"用一張『回訪階梯』記錄首次參加、再次參加、主動協助、提出主題、共同決策五種層級；不要用作品好壞作為主要指標。","caseStudy":{"realWorld":true,"country":"美國","location":"明尼亞波利斯／Walker Art Center","title":"Art Club","statusAsOf":"2026-09-26","latestUpdate":"Walker於2026年9月23日公布秋季Art Club回歸，免費週四系列面向各種經驗程度，安排繪畫、陶藝、首飾、zine、攝影與其他創作活動。","references":[{"title":"Art Club Returns to the Walker for a Fall Season of Free Thursday Night Creativity","publisher":"Walker Art Center","url":"https://www.walkerart.org/press-releases/art-club-returns-to-the-walker-for-a-fall-season-of-free-thursday-night-creativity/","accessedAt":"2026-09-26"}]},"rawText":"【事實】Walker官方明確說明Art Club為免費週四活動，鼓勵不同程度參與者試驗媒材、交流與創作。\n【推論】真正值得追蹤的公共性不只在單次人數，而在是否形成回訪、熟悉與貢獻。\n【原創模擬】三週Art Club與回訪階梯為Curator OS方法。"},{"id":"daily-2026-09-25-family","daily":true,"date":"2026-09-25","category":"親子觀展教育訓練","lens":"故事、圖像與共同想像","source":"MoMA官方Family Book Reading資料（查證截至2026-09-26）","title":"先讀故事再看畫：孩子能不能用自己的圖像把經典作品重新打開？","summary":"MoMA於9月26日安排《Into the Starry Night》作者Curtis R. Scott現場親子讀書活動，建議兩歲以上兒童與成人共同參與。今日將故事閱讀轉成觀展方法：先讓孩子形成自己的圖像，再回到作品，而不是先告訴他『名畫應該怎麼看』。","questions":["讀到標題時孩子先想像出什麼畫面？","在看見原作前，哪些顏色與形狀已經出現在他的描述裡？","成人是否太快說出藝術家姓名與標準答案？","故事中的情緒與作品中的視覺線索是否真的一致？","孩子看見作品後會保留還是修改原本想像？","哪一個問題能讓成人和孩子都沒有標準答案？","兩歲與十歲孩子適合使用相同提問嗎？","故事是否讓作品更親近，也可能限制其他閱讀？","如何讓孩子用動作、聲音或畫線回應，而不只說話？","離開展場後，家庭可以用什麼方式把故事繼續寫下去？"],"strategy":"採用『先想像、再觀看、再改寫』三步法。成人延後藝術史資訊五分鐘，先保存孩子第一版圖像與語言，再比較作品真正改變了什麼。","task":"選一幅你熟悉的作品，不先給孩子看。先用100字故事描述其中一個情境，讓孩子畫出想像；再看作品，請他只改三個地方。","training":"30至45分鐘完成：故事5分鐘、想像畫10分鐘、看作品10分鐘、共同改寫10分鐘。成人只負責記錄孩子新增與刪除的線索。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"Family Book Reading: Into the Starry Night","statusAsOf":"2026-09-26","latestUpdate":"MoMA官方列活動於2026年9月26日10:30與11:00舉行，由Curtis R. Scott朗讀2026年出版的《Into the Starry Night》，建議兩歲以上兒童與成人共同參與。","references":[{"title":"Family Book Reading","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/events/11703","accessedAt":"2026-09-26"}]},"rawText":"【事實】MoMA於9月26日安排《Into the Starry Night》親子閱讀活動。\n【推論】故事可作為作品觀看前的想像入口，但也可能預先框定閱讀。\n【原創模擬】先想像—再觀看—再改寫為Curator OS親子訓練。"},{"id":"daily-2026-09-25-life","daily":true,"date":"2026-09-25","category":"人生策展課題","lens":"噪音、沉默與注意力配置","source":"Curator OS原創人生策展，參照Barbican Repercussions議題","title":"你的生活裡，哪些聲音一直在替別人佔用你的注意力？","summary":"人生策展不只管理時間，也管理感官入口。今天借用sonic rights的觀念，把生活中的通知、談話、機械聲、背景影音與真正需要的安靜分開；不是追求絕對寂靜，而是重新取得注意力的選擇權。","questions":["今天第一個進入你耳朵的聲音是什麼？","哪些聲音由你選擇，哪些只是被動承受？","手機通知一天打斷你多少次？","工作室裡哪一種聲音讓你進入專注，哪一種讓你疲乏？","你是否用背景影音逃避真正需要面對的空白？","哪一段安靜會讓你焦躁，為什麼？","哪些人的聲音值得被你主動保留？","你能否為創作建立一個固定的無通知聲場？","哪些噪音可以透過設備、時段或空間配置降低？","明天你願意保護哪30分鐘不被任何聲音要求佔用？"],"strategy":"把聲音分成主動選擇、工作必要、關係重要、可降低、可刪除五類。先刪一種，再保護一段安靜，不要同時改整個生活。","task":"做一張24小時聲音紀錄，只記錄最常出現的十種聲音與它們帶來的能量變化。晚上選一種要保留、一種要降低。","training":"連續三天設一段30分鐘無通知時段，固定做同一件需要深度注意的事；只記錄開始前與結束後的精神狀態。","caseStudy":{"realWorld":false,"title":"30分鐘聲音斷捨離","statusAsOf":"2026-09-26","latestUpdate":"Curator OS原創人生策展練習；概念參照Barbican 2026《Repercussions》對sonic rights與silence的公共討論。","references":[{"title":"Barbican announces Repercussions","publisher":"Barbican Centre","url":"https://www.barbican.org.uk/our-story/press-room/barbican-announces-repercussions-a-landmark-cross-arts-takeover-led-by-turner","accessedAt":"2026-09-26"}]},"rawText":"【事實】Barbican《Repercussions》公開討論sonic rights與silence。\n【推論】個人也可以把聲音視為注意力環境。\n【原創模擬】24小時聲音紀錄與三天無通知時段為Curator OS人生策展練習。"},{"id":"daily-2026-09-26-curator","daily":true,"date":"2026-09-26","category":"專業策展人提問思考課題","lens":"跨媒介策展、議題密度與方法一致性","source":"Barbican官方資料（查證截至2026-09-26）","title":"當一個策展命題跨越裝置、表演、電影與音樂，什麼才是真正把它們黏在一起的骨架？","summary":"《Repercussions》在Barbican於今天進入最後一天。它橫跨裝置、表演、放映、音樂與參與活動，但真正需要研究的不是媒材很多，而是同一個sonic rights命題如何在不同媒介中被重複檢驗。今日練習策展的『跨媒介一致性』。","questions":["如果拿掉所有媒材名稱，這個展覽還剩下哪一句核心問題？","每個媒介提供了什麼其他媒介無法完成的證據？","哪些作品只是形式不同，實際上沒有增加新的判斷？","觀眾在聲音、影像與表演之間如何知道自己仍在同一命題裡？","跨媒介是否增加理解，也可能稀釋問題強度？","哪一個節點應該提供概念重置，而不是繼續增加內容？","參與活動與正式作品的知識地位是否相等？","不同媒介造成的時間尺度差異如何被策展？","如果預算砍半，你會留下哪三種媒介，理由是什麼？","展覽結束後，哪一個命題仍能單獨成立而不依賴大型場館？"],"strategy":"使用『命題—證據—媒介』矩陣：每個媒介都必須對核心命題提供一種獨特證據。若兩個媒介提供相同證據，合併或刪除其中一個。","task":"拿你正在發展的一個策展案，列出五種可能媒介。為每一種只寫一句『它證明了什麼』；刪掉無法提出獨特證據的媒介。","training":"90分鐘做兩版策展：完整版與50%刪減版。比較刪減後核心問題是否更清楚，並把被刪媒介的功能轉移給保留項目。","caseStudy":{"realWorld":true,"country":"英國","location":"倫敦／Barbican Centre","title":"Repercussions: A takeover by Lawrence Abu Hamdan and Earshot","statusAsOf":"2026-09-26","latestUpdate":"2026年9月26日為Barbican《Repercussions》四日計畫最後一天；官方將裝置、表演、放映、現場音樂與參與活動整合於sonic rights主題下。","references":[{"title":"Barbican announces Repercussions","publisher":"Barbican Centre","url":"https://www.barbican.org.uk/our-story/press-room/barbican-announces-repercussions-a-landmark-cross-arts-takeover-led-by-turner","accessedAt":"2026-09-26"}]},"rawText":"【事實】《Repercussions》於9月23至26日跨越多種藝術形式。\n【推論】跨媒介策展的品質可由每種媒介是否提供獨特證據來檢查。\n【原創模擬】命題—證據—媒介矩陣與50%刪減測試為Curator OS方法。"},{"id":"daily-2026-09-26-training","daily":true,"date":"2026-09-26","category":"策展思考訓練","lens":"觀看順序、導覽依賴與自主判斷","source":"MoMA官方活動資料（查證截至2026-09-26）","title":"先不要聽導覽：你能不能在專家解說前，先形成自己的第一版判斷？","summary":"MoMA今天安排Before-Hours Tours with an Art Historian。專家導覽可以提高資訊密度，也可能過早替觀眾建立解釋框架。今天做一個雙輪測試：先獨立觀看，再聽解說，辨認哪些理解是你自己形成、哪些是被權威語言重新排序。","questions":["在沒有解說前，你最先注意到什麼？","你能否用三句話形成暫時判斷而不查資料？","專家解說新增的是事實、脈絡還是評價？","哪一句解說讓你改變原本判斷？","哪些原本重要的細節在解說後反而被你忽略？","你是否因專家身份而停止提出反例？","哪些資訊若提前知道，會限制第一次觀看？","哪些資訊若完全不提供，又會造成嚴重誤讀？","策展文字應該放在第一次看之前還是之後？","你如何讓觀眾同時保留自主判斷與可靠脈絡？"],"strategy":"採雙輪觀看：第一輪禁止查資料，只記觀察與假設；第二輪加入專家資料，再標記哪些被支持、修正或推翻。不要把第二輪自動視為正確答案。","task":"選一件你熟悉但尚未研究的作品，先看10分鐘寫200字；再查官方資料10分鐘，重寫200字，逐句標記FACT、INFERENCE、REVISION。","training":"60分鐘完成雙輪筆記，最後只保留三個最重要的『被修正點』，並將它們轉成展場文字需要提供的最低脈絡。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"Before-Hours Tours with an Art Historian","statusAsOf":"2026-09-26","latestUpdate":"MoMA 2026年9月26日行事曆列有9:30至10:30的Before-Hours Tours with an Art Historian。","references":[{"title":"MoMA Events — Sep 26, 2026","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/?date=2026-09-26&happening_filter=All+events","accessedAt":"2026-09-26"}]},"rawText":"【事實】MoMA今天安排Before-Hours Tours with an Art Historian。\n【推論】專家資訊的進場順序會改變觀眾形成判斷的方式。\n【原創模擬】雙輪觀看與FACT／INFERENCE／REVISION標記為Curator OS訓練。"},{"id":"daily-2026-09-26-participatory","daily":true,"date":"2026-09-26","category":"國際民眾參與策展實作","lens":"無經驗門檻、材料入口與共同創作文化","source":"Walker Art Center官方Art Club資料（查證截至2026-09-26）","title":"「任何程度都可以」不夠：你如何真的讓第一次來的人敢開始？","summary":"Walker Art Club明確標示活動適合all skill levels，並以免費、材料試驗與每週不同媒材建立入口。今天把『歡迎所有人』拆成具體的參與設計：一個人如何在不知道規則、沒有技術、也不認識任何人的情況下，五分鐘內開始。","questions":["入口是否需要報名、費用或專業詞彙？","第一次來的人看見材料後知道第一步嗎？","是否有一個不必問人的自助開始方式？","熟練參與者會不會無意中壟斷材料與注意力？","工作人員的示範會降低焦慮還是製造標準答案？","完成品是否被過度重視而壓迫試驗？","不想聊天的人是否仍能舒服參與？","語言、年齡、身體差異需要哪些替代入口？","離開時參與者能否帶走方法而非只有物件？","下一次回來時，他能否擁有更多自主權？"],"strategy":"設計『五分鐘啟動』：30秒看懂、2分鐘可試、5分鐘有第一個痕跡。任何需要工作人員長篇解釋才能開始的步驟都視為門檻。","task":"為你的一個公共藝術工作坊做A4單頁啟動卡，只用圖像與三句短句。找一位沒參與設計的人測試，看他是否能在五分鐘內開始。","training":"60至75分鐘完成啟動卡、一次實測、一次修正；記錄測試者第一次停住或詢問的位置，將其視為流程設計問題。","caseStudy":{"realWorld":true,"country":"美國","location":"明尼亞波利斯／Walker Art Center","title":"Walker Art Club","statusAsOf":"2026-09-26","latestUpdate":"Walker官方Art Club頁面說明系列免費、每週四進行，活動設計給所有技能程度參與者，媒材涵蓋繪畫、雕塑、zine、首飾與其他創作形式。","references":[{"title":"Art Club","publisher":"Walker Art Center","url":"https://www.walkerart.org/seasons/art-club/","accessedAt":"2026-09-26"}]},"rawText":"【事實】Walker Art Club強調free creativity、new mediums與all skill levels。\n【推論】真正的低門檻必須能被觀察為『不用先懂規則也能開始』。\n【原創模擬】五分鐘啟動與A4啟動卡為Curator OS參與式設計工具。"},{"id":"daily-2026-09-26-family","daily":true,"date":"2026-09-26","category":"親子觀展教育訓練","lens":"親子共讀、成人退位與兒童提問","source":"MoMA官方Family Book Reading資料（2026-09-26）","title":"今天不要替孩子問問題：讓他先決定這張畫最值得問什麼。","summary":"MoMA今天舉行《Into the Starry Night》Family Book Reading，適合兩歲以上兒童與成人陪同。今日訓練把成人從『解說者』移到『記錄者』：孩子先提出問題，成人只幫忙保存、追問與比較。","questions":["孩子第一個問題是在問人物、顏色、故事還是原因？","成人能否忍住不立刻回答？","哪個問題其實比作品標準解說更接近孩子的觀看？","孩子是否會重複問同一題？重複代表什麼？","兩歲孩子的指認與動作能否也被當成問題？","成人如何區分孩子真的好奇與只是配合？","什麼時候適合提供藝術史資訊？","資訊提供後，孩子的問題變多還是變少？","家庭成員能否各自保留不同答案？","離場前最值得帶走的是答案，還是一個仍想追問的問題？"],"strategy":"採『孩子先問三題』規則：看作品前成人不出題；孩子提出或用動作指出三個疑問後，成人才選其中一題共同查找線索。","task":"找一件圖像豐富的作品，給孩子三分鐘自由看。成人只記錄原句與指向，不修正文法、不補詞；最後一起選一題畫成小卡。","training":"30分鐘完成：自由看3分鐘、記問題7分鐘、找線索10分鐘、做問題卡10分鐘。成果不是答案，而是保存一個孩子自己的觀看入口。","caseStudy":{"realWorld":true,"country":"美國","location":"紐約／MoMA","title":"Family Book Reading: Into the Starry Night","statusAsOf":"2026-09-26","latestUpdate":"活動於今天10:30與11:00舉行，MoMA說明為作者Curtis R. Scott朗讀兒童書《Into the Starry Night》，建議兩歲以上兒童與成人同行。","references":[{"title":"Family Book Reading","publisher":"The Museum of Modern Art","url":"https://www.moma.org/calendar/events/11703","accessedAt":"2026-09-26"}]},"rawText":"【事實】MoMA今天舉行親子共讀活動。\n【推論】共讀可以成為把藝術語言交還給孩子的入口，但成人解說也可能過早封閉提問。\n【原創模擬】孩子先問三題與問題卡為Curator OS親子觀展方法。"},{"id":"daily-2026-09-26-life","daily":true,"date":"2026-09-26","category":"人生策展課題","lens":"反覆回訪、技能累積與生活節奏","source":"Curator OS原創人生策展，參照Walker Art Club 2026秋季系列","title":"你需要的不是更多新計畫，而是一個願意每週回來的地方嗎？","summary":"很多計畫失敗不是因為缺乏靈感，而是每次都重新開始。Walker Art Club以每週回訪建立創作節奏，提醒人生策展也可以把重點從『下一個新東西』移到『哪件事值得穩定重複』。","questions":["你最近三個月開始了多少新計畫？","其中真正持續四週以上的有幾個？","哪件事每次重新啟動都消耗最多精神？","什麼工作其實適合固定每週同一時段？","你目前缺的是新刺激還是穩定回訪？","哪一項技能若持續12週會明顯累積？","你能否把成果要求降低，只保留出席與開始？","哪個地方最容易讓你進入工作狀態？","誰可以成為固定但不造成壓力的同行者？","十二週後你想看到的是作品數量、能力提升還是生活節奏改變？"],"strategy":"設計一個12週回訪單元：固定同一時段、同一地點、同一核心行為，每週只允許改一個變量。優先保護持續性而非每週求新。","task":"選一件最重要但一直斷續的事，排出未來四週固定90分鐘，不增加其他新工具。每次只記『有沒有開始、留下什麼、下次第一步』。","training":"今天完成第一個90分鐘回訪，結束前必須留下下一次可直接開始的材料與一句起手提示，降低重新啟動成本。","caseStudy":{"realWorld":false,"title":"12週回訪式人生策展","statusAsOf":"2026-09-26","latestUpdate":"Curator OS原創人生策展練習；靈感參照Walker Art Club以每週免費創作活動建立重複參與節奏。","references":[{"title":"Art Club","publisher":"Walker Art Center","url":"https://www.walkerart.org/seasons/art-club/","accessedAt":"2026-09-26"}]},"rawText":"【事實】Walker Art Club採每週四重複出現的免費創作模式。\n【推論】重複回訪本身可以成為技能與關係累積的基礎。\n【原創模擬】12週回訪單元與四週90分鐘測試為Curator OS人生策展。"}]
JSON
          python - <<'PY'
          import json, subprocess
          path='daily-curator-prompts.json'
          with open(path,encoding='utf-8') as f: data=json.load(f)
          with open('/tmp/new_entries.json',encoding='utf-8') as f: new=json.load(f)
          ids={x.get('id') for x in data}
          for day in ['2026-09-25','2026-09-26']:
              batch=[x for x in new if x['date']==day]
              add=[x for x in batch if x['id'] not in ids]
              if add:
                  data.extend(add); ids.update(x['id'] for x in add)
                  with open(path,'w',encoding='utf-8') as f:
                      json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
                  chk=json.load(open(path,encoding='utf-8'))
                  assert sum(1 for x in chk if x.get('date')==day)==5
                  allids=[x.get('id') for x in chk]
                  assert len(allids)==len(set(allids))
                  subprocess.run(['git','config','user.name','Curator OS'],check=True)
                  subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],check=True)
                  subprocess.run(['git','add',path],check=True)
                  subprocess.run(['git','commit','-m',f'Add five curator tasks for {day}'],check=True)
          PY
      - name: Push
        run: git push origin HEAD:main
